name: TromboneTuner
options:
  bundleIdPrefix: com.carter
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  TromboneTuner:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Trombone Tuner
        NSMicrophoneUsageDescription: The tuner listens to your trombone to detect the note you are playing.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carter.trombonetuner
        PRODUCT_NAME: TromboneTuner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        ARCHS: arm64
        VALID_ARCHS: arm64
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
