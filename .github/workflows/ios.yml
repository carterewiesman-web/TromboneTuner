name: Build Trombone Tuner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          if [ ! -d "TromboneTuner.xcodeproj" ]; then
            python3 make_xcodeproj.py
          fi
          ls -la TromboneTuner.xcodeproj/

      - name: Ensure shared scheme
        run: |
          mkdir -p TromboneTuner.xcodeproj/xcshareddata/xcschemes
          cp TromboneTuner.xcscheme TromboneTuner.xcodeproj/xcshareddata/xcschemes/TromboneTuner.xcscheme
          cat TromboneTuner.xcodeproj/xcshareddata/xcschemes/TromboneTuner.xcscheme | head -5

      - name: List targets
        run: xcodebuild -project TromboneTuner.xcodeproj -list

      - name: Build
        run: xcodebuild -scheme TromboneTuner -project TromboneTuner.xcodeproj -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
