name: Build Trombone Tuner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build IPA
        run: |
          xcodebuild -version
          if [ ! -d "TromboneTuner.xcodeproj" ]; then
            python3 make_xcodeproj.py
          fi
          mkdir -p TromboneTuner.xcodeproj/xcshareddata/xcschemes
          cp TromboneTuner.xcscheme TromboneTuner.xcodeproj/xcshareddata/xcschemes/TromboneTuner.xcscheme
          xcodebuild -project TromboneTuner.xcodeproj -target TromboneTuner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
          APP_PATH="build/Release-iphoneos/TromboneTuner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find . -name "TromboneTuner.app" -path "*Release-iphoneos/*" 2>&1 | head -1)
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/ 2>&1
          zip -r TromboneTuner.ipa Payload/
          ls -lh TromboneTuner.ipa
