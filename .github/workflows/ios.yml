name: Build Trombone Tuner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          if [ ! -d "TromboneTuner.xcodeproj" ]; then
            python3 make_xcodeproj.py
          fi

      - name: Ensure shared scheme
        run: |
          mkdir -p TromboneTuner.xcodeproj/xcshareddata/xcschemes
          cp TromboneTuner.xcscheme TromboneTuner.xcodeproj/xcshareddata/xcschemes/TromboneTuner.xcscheme

      - name: Build IPA
        run: xcodebuild -scheme TromboneTuner -project TromboneTuner.xcodeproj -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO build

      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TromboneTuner.app Payload/
          zip -r TromboneTuner.ipa Payload
          ls -lh TromboneTuner.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TromboneTuner-ipa
          path: TromboneTuner.ipa
          retention-days: 7
