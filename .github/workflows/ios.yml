name: Build Trombone Tuner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          if [ ! -d "TromboneTuner.xcodeproj" ]; then
            python3 make_xcodeproj.py
          fi

      - name: Ensure shared scheme
        run: |
          mkdir -p TromboneTuner.xcodeproj/xcshareddata/xcschemes
          cp TromboneTuner.xcscheme TromboneTuner.xcodeproj/xcshareddata/xcschemes/TromboneTuner.xcscheme

      - name: Build for simulator (debug)
        run: xcodebuild -scheme TromboneTuner -project TromboneTuner.xcodeproj -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -80
