name: Build Trombone Tuner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build IPA
        run: |
          xcodebuild -version
          if [ ! -d "TromboneTuner.xcodeproj" ]; then
            python3 make_xcodeproj.py
          fi
          mkdir -p TromboneTuner.xcodeproj/xcshareddata/xcschemes
          cp TromboneTuner.xcscheme TromboneTuner.xcodeproj/xcshareddata/xcschemes/TromboneTuner.xcscheme
          xcodebuild -scheme TromboneTuner -project TromboneTuner.xcodeproj -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          APP_PATH="build/Release-iphoneos/TromboneTuner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find . -name "TromboneTuner.app" -path "*Release-iphoneos/*" 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "TromboneTuner.app" -path "*Release-iphoneos/*" 2>/dev/null | head -1)
          fi
          echo "APP_PATH: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r TromboneTuner.ipa Payload/
          ls -lh TromboneTuner.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TromboneTuner-ipa
          path: TromboneTuner.ipa
          retention-days: 7
