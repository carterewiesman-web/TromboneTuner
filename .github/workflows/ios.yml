name: Build Trombone Tuner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build for simulator (debug)
        run: |
          xcodebuild -version
          python3 make_xcodeproj.py
          mkdir -p TromboneTuner.xcodeproj/xcshareddata/xcschemes
          cp TromboneTuner.xcscheme TromboneTuner.xcodeproj/xcshareddata/xcschemes/TromboneTuner.xcscheme
          xcodebuild -scheme TromboneTuner -project TromboneTuner.xcodeproj -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
