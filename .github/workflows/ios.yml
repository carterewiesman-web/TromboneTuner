name: Build Trombone Tuner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List in project dir
        run: find . -name "*.xcodeproj" -type d

      - name: Try xcodebuild -list with workspace
        run: xcodebuild -workspace TromboneTuner.xcworkspace -list 2>&1 | tail -30

      - name: Try xcodebuild -list with project
        run: xcodebuild -project TromboneTuner.xcodeproj -list 2>&1 | tail -40
