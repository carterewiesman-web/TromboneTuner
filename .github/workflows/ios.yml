name: Build Trombone Tuner IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build IPA
        run: |
          xcodebuild -version
          rm -rf TromboneTuner.xcodeproj TromboneTuner.xcworkspace
          python3 make_xcodeproj.py
          xcodebuild -project TromboneTuner.xcodeproj -target TromboneTuner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
          APP_PATH=$(find . -name "TromboneTuner.app" -path "*Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "TromboneTuner.app" -path "*Release-iphoneos/*" 2>/dev/null | head -1)
          fi
          echo "APP_PATH: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TromboneTuner.ipa Payload/
          ls -lh TromboneTuner.ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TromboneTuner-ipa
          path: TromboneTuner.ipa
          retention-days: 7
